# Stage 4 — SLM Fine-Tuning Dataset Pipeline Configuration
# Academic Project: Personalized Precision Medicine for Oncology Treatment Optimization

project:
  name: "Personalized Precision Medicine for Oncology Treatment Optimization"
  stage: "Stage 4 — SLM Fine-Tuning Dataset Pipeline"
  version: "2.0.0"
  random_seed: 42

paths:
  # Upstream Stage 3 inputs (read-only)
  stage3_parquet_path: "stage-3-nlp-slm/data-engineering/data/processed/clinical_nlp_dataset_v1.parquet"
  stage3_baseline_metrics_path: "stage-3-nlp-slm/nlp/results/metrics/baseline_validation_metrics.json"
  stage3_baseline_report_path: "stage-3-nlp-slm/nlp/reports/baseline_report.md"
  
  # Stage 4 outputs
  output_data_dir: "stage-4-data-engineering/data"
  final_dataset_path: "stage-4-data-engineering/data/slm_finetune_dataset_v1.parquet"
  rejected_dataset_path: "stage-4-data-engineering/data/rejected_pairs.parquet"
  generation_log_path: "stage-4-data-engineering/data/generation_log.parquet"
  
  reports_dir: "stage-4-data-engineering/reports"
  quality_report_json: "stage-4-data-engineering/reports/data_quality_report.json"
  quality_report_md: "stage-4-data-engineering/reports/data_quality_report.md"
  manual_review_audit_md: "stage-4-data-engineering/reports/manual_review_audit.md"

circuit_breaker:
  max_rejection_rate: 0.30  # 30% maximum allowed rejection rate
  warn_rejection_rate: 0.20  # 20% warning threshold

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  patient_id_col: "patient_id"

leakage_audit:
  similarity_threshold: 0.85
  max_features: 1000
  forbidden_outcome_terms:
    - "retrospective survival"
    - "autopsy finding"
    - "overall survival reached"
    - "post-mortem"
    - "subsequent progression on day 180"
    - "future relapse"
    - "post-study survival"

human_audit:
  sample_size_pass: 35
  sample_size_reject: 35
  random_seed: 42
