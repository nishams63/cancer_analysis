# Evaluation Configuration for Stage 3 Clinical NLP & Baseline Systems
# Project: Personalized Precision Medicine for Oncology Treatment Optimization

metadata:
  module: "stage-3-nlp-slm/evaluation"
  version: "1.0.0"
  random_seed: 42
  evaluator_role: "Independent Evaluation Engineer"
  status: "OFFICIAL_EVALUATION"

paths:
  # Upstream Data Paths (Strictly Read-Only)
  upstream_data_dir: "../data-engineering/data/processed"
  raw_dataset_path: "../data-engineering/data/processed/clinical_nlp_dataset_v1.parquet"
  train_split_path: "../data-engineering/data/processed/train.parquet"
  validation_split_path: "../data-engineering/data/processed/validation.parquet"
  locked_test_split_path: "../data-engineering/data/processed/locked_test.parquet"

  # Upstream NLP Artifact Paths (Strictly Frozen & Read-Only)
  nlp_root_dir: "../nlp"
  nlp_artifacts_dir: "../nlp/artifacts"
  nlp_tokenizers_dir: "../nlp/artifacts/tokenizers"
  nlp_encoders_dir: "../nlp/artifacts/encoders"
  nlp_urgency_model: "../nlp/artifacts/urgency_baseline_model.joblib"
  nlp_hazard_model: "../nlp/artifacts/hazard_baseline_model.joblib"
  nlp_tfidf_vectorizer: "../nlp/artifacts/tokenizers/tfidf_vectorizer.joblib"
  nlp_feature_scaler: "../nlp/artifacts/tokenizers/feature_scaler.joblib"
  nlp_numeric_cols: "../nlp/artifacts/tokenizers/numeric_feature_cols.joblib"
  nlp_urgency_encoder: "../nlp/artifacts/encoders/urgency_encoder.joblib"
  nlp_hazard_encoder: "../nlp/artifacts/encoders/hazard_encoder.joblib"

  # Evaluation Output Directories
  results_dir: "results"
  results_validation_dir: "results/validation"
  results_locked_test_dir: "results/locked_test"
  results_metrics_dir: "results/metrics"
  results_predictions_dir: "results/predictions"
  results_confusion_matrices_dir: "results/confusion_matrices"
  results_error_analysis_dir: "results/error_analysis"
  results_robustness_dir: "results/robustness"
  results_calibration_dir: "results/calibration"
  figures_dir: "figures"
  reports_dir: "reports"

schema:
  id_columns:
    document_id: "document_id"
    patient_id: "patient_id"
    encounter_id: "encounter_id"
  text_columns:
    raw_text: "text"
    cleaned_text: "cleaned_text"
  metadata_columns:
    document_type: "document_type"
    document_date: "document_date"
    index_date: "index_date"
    data_split: "data_split"
  targets:
    urgency_level: "urgency_level"
    hazard_type: "hazard_type"
    ner_entities: "ner_entities"
    slm_summary: "slm_summary"

tasks:
  primary_classification:
    name: "urgency_level_classification"
    target_column: "urgency_level"
    classes: ["CRITICAL", "HIGH", "LOW", "MEDIUM"]
    high_risk_class: "CRITICAL"
  secondary_classification:
    name: "hazard_type_classification"
    target_column: "hazard_type"
    classes: ["CARDIAC", "DERMATOLOGIC", "HEMATOLOGIC", "HEPATIC", "NEUROPATHIC", "NONE", "PULMONARY", "RENAL"]
    high_risk_classes: ["HEPATIC", "PULMONARY", "CARDIAC", "RENAL"]
  entity_extraction:
    name: "clinical_named_entity_recognition"
    target_column: "ner_entities"
    entity_types: ["GENE_MUTATION", "DRUG_NAME", "DOSAGE", "ADVERSE_EVENT"]
    matching_modes: ["exact", "relaxed"]
  negation_detection:
    name: "clinical_negation_scoping"
    polarities: ["AFFIRMED", "NEGATED", "HISTORICAL", "RESOLVED"]

bootstrap:
  n_iterations: 1000
  confidence_level: 0.95
  random_seed: 42
  resampling_unit: "patient"

calibration:
  n_bins: 10
  strategy: "uniform"

robustness:
  casing: ["upper", "lower", "title"]
  spacing: ["extra_spaces", "tab_spaced"]
  punctuation: ["remove_commas", "extra_periods"]
  negation_phrases:
    - "denies"
    - "no evidence of"
    - "without"
    - "negative for"
