# Stage 4 — Small Language Model (SLM) Fine-Tuning Configuration
# Academic Project: Personalized Precision Medicine for Oncology Treatment Optimization

model:
  name: "clinical-slm-oncology-v1"
  base_model: "Qwen/Qwen2.5-1.5B-Instruct"  # Base clinical-compatible SLM
  fallback_base_model: "microsoft/BioGPT"
  max_seq_length: 1024
  torch_dtype: "float16"
  device: "auto"  # Automatically uses cuda if available, else cpu

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  learning_rate: 0.0002
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  batch_size: 4
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  eval_steps: 100
  save_steps: 200
  logging_steps: 25
  fp16: true
  gradient_checkpointing: true
  seed: 42

paths:
  train_data: "stage-4-slm/data-engineer/data/slm_finetune_dataset_v1.parquet"
  output_dir: "stage-4-slm/slm/checkpoints"
  adapter_dir: "stage-4-slm/slm/artifacts/lora_adapter"
  tokenizer_dir: "stage-4-slm/slm/artifacts/tokenizer"

prompt_template:
  system_prompt: "You are an oncology clinical decision support assistant. Analyze the clinical note and generate structured Risk, Key Finding, and Action recommendations."
  instruction: "Analyze the clinical note and provide the patient's Risk, Key Finding, and Action."
