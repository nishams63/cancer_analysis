model:
  name: "llama"
  model_id: "meta-llama/Llama-3.2-3B-Instruct"
  revision: "main"
  license: "Meta Llama 3.2 Community License (Gated)"
  requires_auth: true
  context_length: 131072
  architecture: "LlamaForCausalLM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  learning_rate: 2.0e-4
  num_train_epochs: 2
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  eval_steps: 50
  save_total_limit: 2
